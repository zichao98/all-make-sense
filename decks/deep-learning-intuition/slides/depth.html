<p style="font-size:26px;font-weight:700;letter-spacing:4px;color:#F0995E">第三部分</p>
<h1 style="font-family:'Noto Serif TC', Georgia, serif;font-size:120px;font-weight:700;line-height:1.1;color:#F3EEE3">為什麼要「深」？</h1>
<p style="font-size:48px;line-height:1.4;color:#F0995E">寬度讓轉折「相加」，深度讓轉折「相乘」。</p>
<p style="font-size:32px;line-height:1.5;color:#B9C4CF;width:1300px">到目前為止都是一層。多疊一層，就能把前一層做好的折線再「折一次」，轉折數會翻倍成長。</p>
<aside>前面的公式只適用於一層隱藏層。深度學習之所以叫「深度」，是因為疊層會帶來完全不同的效率。</aside>
</section>
