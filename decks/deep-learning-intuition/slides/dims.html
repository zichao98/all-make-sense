<h1 style="font-family:'Noto Serif TC', Georgia, serif;font-size:120px;font-weight:700;line-height:1.1;color:#F3EEE3">走到二維、三維</h1>
<p style="font-size:48px;line-height:1.4;color:#F0995E">轉折「點」變成一條折痕、一個折面。</p>
<p style="font-size:32px;line-height:1.5;color:#B9C4CF;width:1400px">傅立葉也一樣：一維的波，到了二維變成一道道平行的「平面波」。在高維裡，神經元和傅立葉長得比一維時更像。</p>
<aside>前面全部都是一維輸入 x。真實的網路輸入是很多維的（一張圖就有幾十萬個像素）。這一段看看「折」在二維、三維長什麼樣，以及傅立葉在高維的對應物。</aside>
