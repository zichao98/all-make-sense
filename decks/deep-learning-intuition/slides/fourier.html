<p style="font-size:26px;font-weight:700;letter-spacing:4px;color:#7FB2E8">第四部分</p>
<h1 style="font-family:'Noto Serif TC', Georgia, serif;font-size:120px;font-weight:700;line-height:1.1;color:#F3EEE3">傅立葉和神經元是親戚</h1>
<p style="font-size:48px;line-height:1.4;color:#7FB2E8">傅立葉級數＝一層「sin 神經元」，只是第一層的權重被釘死了。</p>
<p style="font-size:32px;line-height:1.5;color:#B9C4CF;width:1400px">兩者都把複雜的函數拆成很多個簡單形狀的加權和。差別在於：形狀是什麼，以及形狀能不能自己移動。</p>
<aside>傅立葉也能表達（幾乎）所有函數，神經網路也能（萬能近似定理）。它們之所以都「萬能」，是因為本質上是同一種結構。</aside>
