# 推到 main 就自動 build 並部署到 Cloudflare Workers；PR 只做嚴格檢查。
# 需要在 GitHub repo 的 Settings → Secrets and variables → Actions 設定：
#   CLOUDFLARE_API_TOKEN   （權限：Account → Workers Scripts → Edit）
#   CLOUDFLARE_ACCOUNT_ID
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every deck
        run: node build.mjs --all --strict
      - name: Build site
        run: node build.mjs
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
